<template id="case-sliver-cta-template">
  <div class="case-sliver-cta my-12">
    <div class="sliver-card">
      <div class="sliver-body">
        <div>
          <p class="eyebrow mb-2">Let's explore together</p>
          <h3 class="font-display text-xl text-white mb-2 font-bold">Is Content.One right for you?</h3>
          <p class="m-0 text-white/75">See how we can unify your sites, speed up content delivery, and keep your teams in sync.</p>
        </div>
        <div class="sliver-actions">
          <a href="/contact/" class="inline-flex items-center rounded-full bg-white text-gray-900 font-semibold px-4 py-2 hover:bg-gray-100 transition">Setup Exploratory Call</a>
          <a href="/customers/" class="inline-flex items-center rounded-full border border-white/65 text-gray-200 font-semibold px-4 py-2 hover:bg-white hover:text-gray-900 transition">Explore more stories</a>
        </div>
      </div>
    </div>
  </div>
</template>

<style>
  .case-sliver-cta .sliver-card {
    background: radial-gradient(120% 120% at 0% 0%, rgba(63, 81, 181, 0.25), rgba(15, 23, 42, 0.9)),
                linear-gradient(135deg, #0b1224 0%, #111a32 60%, #0f172a 100%);
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.15);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .case-sliver-cta .sliver-body {
    display: flex; flex-wrap: wrap; gap: 1rem;
    align-items: center; justify-content: space-between;
    padding: 1.5rem;
  }
  .case-sliver-cta .eyebrow {
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700; color: #a5b4fc;
  }
  .case-sliver-cta .sliver-actions {
    display: flex; flex-wrap: wrap; gap: 0.75rem;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var template = document.getElementById('case-sliver-cta-template');
    if (!template) return;

    var caseStudyContainers = document.querySelectorAll('[class$="case-study"]');
    if (!caseStudyContainers.length) return;

    caseStudyContainers.forEach(function (container) {
      var sections = container.querySelectorAll('.fade-section');
      if (!sections.length) return;

      sections.forEach(function (section, idx) {
        var position = idx + 1;
        var alreadyHasSliver = section.nextElementSibling && section.nextElementSibling.classList.contains('case-sliver-cta');
        if (position % 5 === 0 && !alreadyHasSliver) {
          var clone = template.content.cloneNode(true);
          section.insertAdjacentElement('afterend', clone.querySelector('.case-sliver-cta'));
        }
      });
    });
  });
</script>
