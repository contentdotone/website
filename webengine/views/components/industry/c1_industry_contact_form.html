<!-- C1 Industry-Specific Contact Form — Figma 14031:569492 (Untitled-C1).
     Light lavender bg (#eceef9) with dark primary/secondary heading,
     max-w-768px form area with a full-width pill submit. Zoho form
     include renders its default light styling; the orchestrator adds
     the pill treatment for the submit button.
     Section id="c1-industry-demo-form" is the anchor target for the hero CTA. -->
<section id="c1-industry-demo-form" class="bg-[#eceef9] py-24">
  <div class="mx-auto px-4 sm:px-6 lg:px-8 max-w-[480px] md:max-w-[640px] lg:max-w-3xl flex flex-col gap-16">

    <!-- Heading + subhead, centered -->
    <div class="flex flex-col gap-5 items-center text-center w-full">
      <h2 class="font-display font-semibold text-[#171717] text-[30px] leading-[38px] lg:text-[36px] lg:leading-[44px] lg:tracking-[-0.72px] m-0">Take Content.One further</h2>
      <p class="font-body text-[#525252] text-lg leading-7 lg:text-xl lg:leading-[30px] m-0">Contact us to speak to a content expert</p>
    </div>

    <!-- Shared Zoho form include — default light styling; orchestrator adds pill submit -->
    <div class="c1-industry-form-wrap w-full">
      {{include /components/forms/zoho-form.html}}
    </div>

  </div>

  <script>
    // Override the form submit button label on the industry-specific contact form.
    (function () {
      var btn = document.querySelector('.c1-industry-form-wrap form button[type="submit"]');
      if (btn && btn.textContent.trim() === 'Submit') btn.textContent = 'Contact Sales';
    })();
  </script>
</section>
