<style>
  /* Hide all panes by default; show the one whose radio is checked. */
  .persona-pane { display: none; }
  #persona-content:checked ~ .grid .persona-pane[data-for="persona-content"],
  #persona-cmo:checked ~ .grid .persona-pane[data-for="persona-cmo"],
  #persona-cio:checked ~ .grid .persona-pane[data-for="persona-cio"] { display: block; animation: persona-fade .25s ease; }
  /* Active label highlight */
  #persona-content:checked ~ .grid label[for="persona-content"],
  #persona-cmo:checked ~ .grid label[for="persona-cmo"],
  #persona-cio:checked ~ .grid label[for="persona-cio"] { background: rgba(66,85,189,0.08); }
  @keyframes persona-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
