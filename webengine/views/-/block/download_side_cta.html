<aside class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-3">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Download</p>
    <h3 class="text-2xl font-semibold text-slate-900">{{this.title}}</h3>
    <p class="text-sm leading-6 text-slate-600">{{this.description}}</p>
    <button
      type="button" 
      data-download-modal-open
      class="mt-2 inline-flex items-center justify-center rounded-full bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
    >
      Get the download
    </button> 
  </div>
</aside> 
 
<div
  class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 opacity-0 transition duration-200"
  data-download-modal
  aria-hidden="true"
>
  <div class="mx-4 w-full max-w-lg rounded-2xl bg-white p-8 shadow-2xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Download</p>
        <h2 class="mt-2 text-2xl font-semibold text-slate-900">C1: Basic Download Form</h2>
        <p class="mt-2 text-sm text-slate-600">Complete the form to get instant access.</p>
      </div>
      <button
        type="button"
        data-download-modal-close
        class="rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-500 transition hover:text-slate-700"
      >
        Close
      </button>
    </div>

    <!-- Change or deletion of the name attributes in the input tag will lead to empty values on record submission-->
    <form
      action="https://forms.zohopublic.com/zestyio/form/C1BasicDownloadForm/formperma/CAH44WVZi37AAFGMHJdSe3ShYIMonSRIqPB_njiGCpw/htmlRecords/submit"
      name="form"
      id="form"
      method="POST"
      accept-charset="UTF-8"
      enctype="multipart/form-data"
      class="mt-6 space-y-4"
    >
      <input type="hidden" name="zf_referrer_name" value="" />
      <input type="hidden" name="zf_redirect_url" value="" />
      <input type="hidden" name="zc_gad" value="" />

      <label class="block text-sm font-semibold text-slate-700">
        First Name
        <input
          type="text"
          name="SingleLine1"
          value=""
          fieldType="1"
          maxlength="255"
          placeholder=""
          class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20"
        />
      </label>

      <label class="block text-sm font-semibold text-slate-700">
        Last Name <span class="text-rose-500">*</span>
        <input
          type="text"
          name="SingleLine"
          value=""
          fieldType="1"
          maxlength="255"
          placeholder=""
          class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20"
        />
      </label>

      <label class="block text-sm font-semibold text-slate-700">
        Email <span class="text-rose-500">*</span>
        <input
          type="text"
          maxlength="255"
          name="Email"
          value=""
          fieldType="9"
          placeholder=""
          class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20"
        />
      </label>

      <button
        type="submit"
        class="inline-flex w-full items-center justify-center rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
      >
        Submit
      </button>
    </form>
  </div>
</div>

<script> 
  (() => {
    const modal = document.querySelector("[data-download-modal]");
    const openButton = document.querySelector("[data-download-modal-open]");
    const closeButton = document.querySelector("[data-download-modal-close]");

    if (!modal || !openButton || !closeButton) return;

    const openModal = () => {
      modal.classList.remove("pointer-events-none", "opacity-0");
      modal.setAttribute("aria-hidden", "false");
    };

    const closeModal = () => {
      modal.classList.add("pointer-events-none", "opacity-0");
      modal.setAttribute("aria-hidden", "true");
    };

    openButton.addEventListener("click", openModal);
    closeButton.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });
  })();
</script>
