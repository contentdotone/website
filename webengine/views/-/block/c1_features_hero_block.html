<!-- C1 Features Hero Block — Block model 6-dad8d5b1a8-mhb7xr.
     Fields: overline, title, subheading, image, cta_1, cta_1_link, cta_2, cta_2_link.
     Variants: pages reference by variant ZUID via {{blocks('7-...')}} or via a
     content-field reference. Visual treatment per Figma 13863:4419 (XL),
     13863:4433 (LG), 13863:4449 (MD), 13863:4465 (SM). Dark gradient hero,
     left-aligned single column, skeumorphic CTAs. -->
<section class="c1-features-hero relative overflow-hidden pt-24 lg:pt-32 pb-20 lg:pb-24">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-8 relative">
    <div class="max-w-[480px] md:max-w-[640px] flex flex-col gap-12">
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-4">
          {{if {this.overline} }}
            <span class="self-start inline-flex items-center px-2 py-0.5 rounded-full bg-[#fafafa] border border-[#e5e5e5] text-xs font-medium text-[#404040]">{{this.overline}}</span>
          {{end-if}}
          <h1 class="font-display font-semibold text-white text-[30px] leading-[38px] md:text-[36px] md:leading-[44px] md:tracking-[-0.72px] lg:text-[48px] lg:leading-[60px] lg:tracking-[-0.96px] m-0">{{this.title}}</h1>
        </div>
        {{if {this.subheading} }}
          <p class="text-[#b1bae7] text-sm leading-5 tracking-[0.14px] md:text-base md:leading-6 md:tracking-normal lg:text-xl lg:leading-[30px] max-w-[480px] m-0">{{this.subheading}}</p>
        {{end-if}}
      </div>

      {{if {this.cta_1} OR {this.cta_2} }}
      <div class="flex flex-col sm:flex-row gap-4">
        {{if {this.cta_1} }}
          <a href="{{this.cta_1_link.getURL()}}" class="c1-features-hero__cta-primary inline-flex items-center justify-center rounded-lg text-white font-semibold text-base leading-6 px-[18px] py-3 border-2 border-white/[0.12] shadow-sm transition">{{this.cta_1}}</a>
        {{end-if}}
        {{if {this.cta_2} }}
          <a href="{{this.cta_2_link.getURL()}}" class="c1-features-hero__cta-secondary inline-flex items-center justify-center rounded-lg bg-white text-[#404040] hover:bg-gray-50 font-semibold text-base leading-6 px-[18px] py-3 border border-[#d4d4d4] shadow-sm transition">{{this.cta_2}}</a>
        {{end-if}}
      </div>
      {{end-if}}
    </div>
  </div>
</section>

<style>
  .c1-features-hero {
    background: linear-gradient(180deg, #19214e 0%, #060813 100%);
  }
  /* Skeumorphic primary CTA — Figma shadow-xs-skeuomorphic (drop-shadow + inset border + inset bottom highlight). */
  .c1-features-hero__cta-primary {
    background-color: #31429b;
    box-shadow:
      0 1px 2px 0 rgba(0, 0, 0, 0.05),
      inset 0 0 0 1px rgba(0, 0, 0, 0.18),
      inset 0 -2px 0 0 rgba(0, 0, 0, 0.05);
  }
  .c1-features-hero__cta-primary:hover { background-color: #2F3F94; }
  /* Skeumorphic secondary CTA — same shadow recipe on a white fill. */
  .c1-features-hero__cta-secondary {
    box-shadow:
      0 1px 2px 0 rgba(0, 0, 0, 0.05),
      inset 0 0 0 1px rgba(0, 0, 0, 0.18),
      inset 0 -2px 0 0 rgba(0, 0, 0, 0.05);
  }
</style>
