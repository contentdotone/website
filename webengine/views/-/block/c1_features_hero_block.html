<!-- C1 Features Hero Block — Block model 6-dad8d5b1a8-mhb7xr.
     Fields: overline, title, subheading, image, cta_1, cta_1_link, cta_2, cta_2_link.
     Visual treatment per Figma 13863:4419 (XL), 13863:4433 (LG), 13863:4449 (MD),
     13863:4465 (SM). Dark gradient hero, left-aligned single column, skeumorphic CTAs.
     Critical visual properties (padding / type ramp / max-widths) inlined via the
     scoped <style> at the bottom rather than Tailwind utilities — Tailwind Play CDN
     was missing arbitrary-value classes on this page's runtime scan. -->
<section class="c1-features-hero">
  <div class="c1-features-hero__container">
    <div class="c1-features-hero__content">

      <div class="c1-features-hero__heading-group">
        {{if {this.overline} }}
          <span class="c1-features-hero__overline">{{this.overline}}</span>
        {{end-if}}
        <h1 class="c1-features-hero__title">{{this.title}}</h1>
      </div>

      {{if {this.subheading} }}
        <p class="c1-features-hero__subheading">{{this.subheading}}</p>
      {{end-if}}

      {{if {this.cta_1} OR {this.cta_2} }}
      <div class="c1-features-hero__ctas">
        {{if {this.cta_1} }}
          <a href="{{this.cta_1_link.getURL()}}" class="c1-features-hero__cta c1-features-hero__cta--primary">{{this.cta_1}}</a>
        {{end-if}}
        {{if {this.cta_2} }}
          <a href="{{this.cta_2_link.getURL()}}" class="c1-features-hero__cta c1-features-hero__cta--secondary">{{this.cta_2}}</a>
        {{end-if}}
      </div>
      {{end-if}}

    </div>
  </div>
</section>

<style>
  /* Self-contained CSS so the block renders regardless of which page's Tailwind
     scan has compiled which utility classes. */
  .c1-features-hero {
    background: linear-gradient(180deg, #19214e 0%, #060813 100%);
    padding: 96px 0 80px;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 1024px) {
    .c1-features-hero { padding: 128px 0 96px; }
  }
  .c1-features-hero__container {
    max-width: 80rem;
    margin: 0 auto;
    padding: 0 1rem;
  }
  @media (min-width: 640px) { .c1-features-hero__container { padding: 0 1.5rem; } }
  @media (min-width: 1024px) { .c1-features-hero__container { padding: 0 2rem; } }
  .c1-features-hero__content {
    display: flex;
    flex-direction: column;
    gap: 48px;
    max-width: 480px;
  }
  @media (min-width: 768px) { .c1-features-hero__content { max-width: 640px; } }
  .c1-features-hero__heading-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .c1-features-hero__overline {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 9999px;
    background: #fafafa;
    border: 1px solid #e5e5e5;
    color: #404040;
    font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 18px;
  }
  .c1-features-hero__title {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 600;
    color: #ffffff;
    font-size: 30px;
    line-height: 38px;
    letter-spacing: 0;
    margin: 0;
  }
  @media (min-width: 768px) {
    .c1-features-hero__title { font-size: 36px; line-height: 44px; letter-spacing: -0.72px; }
  }
  @media (min-width: 1024px) {
    .c1-features-hero__title { font-size: 48px; line-height: 60px; letter-spacing: -0.96px; }
  }
  .c1-features-hero__subheading {
    font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
    color: #b1bae7;
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.14px;
    max-width: 480px;
    margin: 0;
  }
  @media (min-width: 768px) {
    .c1-features-hero__subheading { font-size: 16px; line-height: 24px; letter-spacing: normal; }
  }
  @media (min-width: 1024px) {
    .c1-features-hero__subheading { font-size: 20px; line-height: 30px; }
  }
  .c1-features-hero__ctas {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .c1-features-hero__ctas { flex-direction: row; }
  }
  .c1-features-hero__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 24px;
    padding: 12px 18px;
    text-decoration: none;
    transition: background-color 0.15s ease;
    box-shadow:
      0 1px 2px 0 rgba(0, 0, 0, 0.05),
      inset 0 0 0 1px rgba(0, 0, 0, 0.18),
      inset 0 -2px 0 0 rgba(0, 0, 0, 0.05);
  }
  .c1-features-hero__cta--primary {
    background-color: #31429b;
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.12);
  }
  .c1-features-hero__cta--primary:hover { background-color: #2F3F94; }
  .c1-features-hero__cta--secondary {
    background-color: #ffffff;
    color: #404040;
    border: 1px solid #d4d4d4;
  }
  .c1-features-hero__cta--secondary:hover { background-color: #f9fafb; }
</style>
