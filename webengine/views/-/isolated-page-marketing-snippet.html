<!--
  Isolated landing-page marketing snippet.

  Include with `{{include /-/isolated-page-marketing-snippet.html}}` near the
  end of <head> (preferred — GTM and Clarity want to load as early as possible)
  OR just before </body>. Both work; head placement gives the best PageView
  fidelity.

  Loads, in order:
    • Microsoft Clarity (session replay + heatmaps)
    • Google Tag Manager (downstream: GA4, Google Ads conversions, etc.)
    • LinkedIn Insight Tag (B2B retargeting)
    • Meta Pixel (Facebook/Instagram retargeting)

  Each loader has a corresponding <noscript> fallback below.
-->
