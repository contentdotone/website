<!--
  Isolated landing-page marketing snippet.

  Include with `{{include /-/isolated-page-marketing-snippet.html}}` near the
  end of <head> on standalone landing pages.

  Output is the raw value of the globals.marketing_snippets field — the
  marketer pastes in their full <script>/<noscript>/<iframe> tags directly
  (Microsoft Clarity, Google Tag Manager, LinkedIn Insight, Meta Pixel,
  whatever else they're running). Do NOT wrap in a <script> tag here — the
  pasted content already has its own tags embedded.

  Guarded with {{if}} so the page still renders if the field isn't yet on the
  globals content model — Parsley otherwise errors hard on missing fields.
-->
{{if {globals.marketing_snippets} }}
{{globals.marketing_snippets}}
{{end-if}}
